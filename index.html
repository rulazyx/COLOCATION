<style>
  /* ---- écran de chargement ---- */
  #splash{position:fixed;inset:0;z-index:9999;background:#fff4d6;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
    transition:opacity .5s ease}
  #splash.out{opacity:0;pointer-events:none}
  .sunwrap{position:relative;width:min(56vw,230px);aspect-ratio:1}
  .sunwrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .hopper{width:70%;animation:hop .7s cubic-bezier(.3,0,.4,1) infinite;transform-origin:50% 100%}
  .hopper svg{display:block;width:100%;height:auto;overflow:visible}
  .shadow{width:42%;height:10px;border-radius:50%;background:rgba(120,70,0,.22);margin-top:4px;animation:shad .7s cubic-bezier(.3,0,.4,1) infinite}
  @keyframes hop{0%,100%{transform:translateY(0) scale(1.08,.9)}12%{transform:translateY(0) scale(.96,1.05)}50%{transform:translateY(-34px) scale(.97,1.04)}88%{transform:translateY(0) scale(1,1)}}
  @keyframes shad{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}
  .ray{transform-box:view-box;transform-origin:100px 100px;opacity:0;transform:scale(.55);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1)}
  .ray.on{opacity:1;transform:scale(1)}
  .disc{transform-box:view-box;transform-origin:100px 100px;animation:breathe 1.6s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.04)}}
  .sunface{opacity:0;transition:opacity .3s}
  #splash.full .sunface{opacity:1}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 3s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .brand{margin-top:26px;font-weight:800;font-size:1.7rem;letter-spacing:.04em;color:#e08a00;text-transform:uppercase}
  .brand small{display:block;text-align:center;font-weight:600;font-size:.8rem;letter-spacing:.2em;color:#c9a35a;margin-top:2px}
  .bar{margin-top:18px;width:150px;height:8px;border-radius:4px;background:rgba(224,138,0,.2);overflow:hidden}
  /* la barre avance par transform (fluide, sans saccades de mise en page) avec un reflet qui glisse */
  .bar i{display:block;height:100%;width:100%;border-radius:4px;transform-origin:0 50%;transform:scaleX(0);will-change:transform;
    background:linear-gradient(90deg,#f5a300,#ffc928 50%,#f5a300) 0 0/200% 100%;animation:barshine 1.4s linear infinite}
  @keyframes barshine{to{background-position:-200% 0}}
  /* le soleil qui s'élargit et recouvre tout l'écran */
  #grow{position:fixed;left:50%;top:var(--cy,45%);width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#ffc928;
    transform:scale(0);z-index:10000;pointer-events:none}
  #grow.go{transition:transform .55s cubic-bezier(.6,0,.3,1);transform:scale(var(--s,400))}
  #grow.fade{transition:opacity .6s;opacity:0}
  #replay{position:fixed;right:12px;bottom:12px;z-index:10001;padding:10px 14px;border-radius:20px;border:0;background:#2f9e6b;color:#fff;font:600 14px system-ui}
  @media (prefers-reduced-motion:reduce){.hopper,.shadow,.eye,.bar i{animation:none}}
</style>
</head>
<body>
  <div id="splash" aria-label="Chargement">
  <div class="sunwrap" id="sunwrap">
    <div class="hopper"><svg viewBox="0 0 80 70" aria-hidden="true">
      <path d="M8 40q-6-10 0-18 4 10 12 14z" fill="#b91c1c"/>
      <circle cx="40" cy="38" r="26" fill="#ef4444"/>
      <ellipse cx="44" cy="48" rx="16" ry="10" fill="#fecaca"/>
      <ellipse cx="30" cy="40" rx="13" ry="8" transform="rotate(-18 30 40)" fill="#b91c1c"/>
      <circle cx="50" cy="28" r="8" fill="#fff"/><circle class="eye" cx="52.5" cy="28" r="4" fill="#111"/>
      <path d="M62 33l16 5-16 7z" fill="#f59e0b"/></svg></div><div class="shadow"></div>
  </div>
  <div class="brand">LA KAZ</div>
  <div class="bar"><i id="barfill"></i></div>
</div>
<div id="grow"></div>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Cette appli a besoin de JavaScript.</noscript>
<script>
// Écran de chargement : splashProgress(0..1) pendant le chargement, splashDone() quand l'appli est prête (voir app.js)
(function () {
  var splash = document.getElementById('splash'), grow = document.getElementById('grow'), fill = document.getElementById('barfill');
  if (!splash) { window.splashProgress = window.splashDone = function () {}; return; }
  var target = 0, shown = 0, t0 = performance.now(), last = t0, finished = false, ended = false;
  function show(p) {
    fill.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    if (p >= 0.995) splash.classList.add('full');
  }
  function end() {
    if (ended) return; ended = true;
    splash.classList.add('out');
    setTimeout(function () { splash.remove(); if (grow) grow.remove(); }, 600);
  }
  // Progression lissée : la barre avance toute seule en ralentissant (sans jamais s'arrêter net) pendant l'attente,
  // rattrape en douceur les étapes réelles, puis file jusqu'au bout quand l'appli est prête
  function tick(now) {
    var dt = Math.min(64, now - last); last = now;
    var creep = 0.9 * (1 - Math.exp(-(now - t0) / 2200));
    var goal = finished ? 1 : Math.min(0.97, Math.max(target * 0.97, creep));
    shown += (goal - shown) * (1 - Math.exp(-dt / (finished ? 140 : 260)));
    if (finished && goal - shown < 0.004) shown = 1;
    show(shown);
    if (finished && shown >= 1) return setTimeout(end, 160);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  window.splashProgress = function (p) { target = Math.max(target, Math.min(1, p)); };
  window.splashDone = function () { finished = true; target = 1; };
  setTimeout(window.splashDone, 15000); // sécurité : on ne bloque jamais l'appli
})();
</script>
