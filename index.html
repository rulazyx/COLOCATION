<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coloc</title>
  <meta name="description" content="Tâches ménagères et ruptures de stock de la coloc">
  <meta name="theme-color" content="#ffc928">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Coloc">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css">
<style>
  /* ---- écran de chargement ---- */
  #splash{position:fixed;inset:0;z-index:9999;background:#fff4d6;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
    transition:opacity .5s ease}
  #splash.out{opacity:0;pointer-events:none}
  .sunwrap{position:relative;width:min(56vw,230px);aspect-ratio:1}
  .sunwrap svg{width:100%;height:100%;overflow:visible}
  .ray{transform-box:view-box;transform-origin:100px 100px;opacity:0;transform:scale(.55);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1)}
  .ray.on{opacity:1;transform:scale(1)}
  .disc{transform-box:view-box;transform-origin:100px 100px;animation:breathe 1.6s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.04)}}
  .sunface{opacity:0;transition:opacity .3s}
  #splash.full .sunface{opacity:1}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 3s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .brand{margin-top:26px;font-weight:800;font-size:1.7rem;letter-spacing:.04em;color:#e08a00;text-transform:lowercase}
  .brand small{display:block;text-align:center;font-weight:600;font-size:.8rem;letter-spacing:.2em;color:#c9a35a;margin-top:2px}
  .bar{margin-top:18px;width:120px;height:6px;border-radius:3px;background:rgba(224,138,0,.2);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#f5a300;border-radius:3px;transition:width .2s}
  /* le soleil qui s'élargit et recouvre tout l'écran */
  #grow{position:fixed;left:50%;top:var(--cy,45%);width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#ffc928;
    transform:scale(0);z-index:10000;pointer-events:none}
  #grow.go{transition:transform .9s cubic-bezier(.6,0,.3,1);transform:scale(var(--s,400))}
  #grow.fade{transition:opacity .6s;opacity:0}
  #replay{position:fixed;right:12px;bottom:12px;z-index:10001;padding:10px 14px;border-radius:20px;border:0;background:#2f9e6b;color:#fff;font:600 14px system-ui}
  @media (prefers-reduced-motion:reduce){.disc,.eye{animation:none}}
</style>
</head>
<body>
  <div id="splash" aria-label="Chargement">
  <div class="sunwrap" id="sunwrap">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <g id="rays" stroke="#ffb300" stroke-width="9" stroke-linecap="round"></g>
      <g class="disc">
        <circle cx="100" cy="100" r="50" fill="#ffd23f" stroke="#ffb300" stroke-width="5"/>
        <g class="sunface">
          <ellipse class="eye" cx="84" cy="94" rx="5" ry="7" fill="#5a3a00"/>
          <ellipse class="eye" cx="116" cy="94" rx="5" ry="7" fill="#5a3a00"/>
          <circle cx="76" cy="108" r="7" fill="#ff8a65" opacity=".55"/>
          <circle cx="124" cy="108" r="7" fill="#ff8a65" opacity=".55"/>
          <path d="M85 108 Q100 126 115 108" fill="none" stroke="#5a3a00" stroke-width="4.5" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
  </div>
  <div class="brand">bienvenue</div>
  <div class="bar"><i id="barfill"></i></div>
</div>
<div id="grow"></div>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Cette appli a besoin de JavaScript.</noscript>
<script>
// Écran de chargement : splashProgress(0..1) pendant le chargement, splashDone() quand l'appli est prête (voir app.js)
(function () {
  var N = 12, rays = document.getElementById('rays'), splash = document.getElementById('splash'), grow = document.getElementById('grow'), fill = document.getElementById('barfill');
  if (!rays || !splash) { window.splashProgress = window.splashDone = function () {}; return; }
  for (var i = 0; i < N; i++) {
    var l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 100); l.setAttribute('y1', 22); l.setAttribute('x2', 100); l.setAttribute('y2', 4);
    l.setAttribute('transform', 'rotate(' + (i * 360 / N) + ' 100 100)');
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'ray'); g.appendChild(l); rays.appendChild(g);
  }
  var rayEls = [].slice.call(rays.children), target = 0, shown = 0, last = performance.now(), finished = false, ended = false;
  function show(p) {
    fill.style.width = (p * 100) + '%';
    rayEls.forEach(function (r, i) { r.classList.toggle('on', p >= (i + 1) / N - 0.001); });
    if (p >= 1) splash.classList.add('full');
  }
  function end() {
    if (ended) return; ended = true;
    var r = document.getElementById('sunwrap').getBoundingClientRect();
    grow.style.setProperty('--cy', (r.top + r.height / 2) + 'px');
    grow.style.setProperty('--s', Math.ceil(Math.hypot(innerWidth, innerHeight) / 5) + 20);
    void grow.offsetWidth; grow.classList.add('go');
    setTimeout(function () { splash.classList.add('out'); grow.classList.add('fade'); }, 1000);
    setTimeout(function () { splash.remove(); grow.remove(); }, 1800);
  }
  // l'affichage rattrape la progression réelle à vitesse limitée : les rayons se voient même si tout charge très vite
  function tick(now) {
    var dt = now - last; last = now;
    shown = Math.min(target, shown + dt * 0.0008);
    show(shown);
    if (finished && shown >= 1) return setTimeout(end, 400);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  window.splashProgress = function (p) { target = Math.max(target, Math.min(1, p)); };
  window.splashDone = function () { finished = true; target = 1; };
  setTimeout(window.splashDone, 15000); // sécurité : on ne bloque jamais l'appli
})();
</script>
  <script type="module" src="app.js"></script>
</body>
</html>
